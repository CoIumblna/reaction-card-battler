name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  battle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: 导入项目
        run: godot --headless --path . --import

      # 自动发现 tests/*_test.gd（tests/pending/ 不参与）。
      # 退出码 0 不等于全绿：脚本报错被吞时测试照样打印 PASS，
      # 所以每个文件额外要求：① 退出码 0 ② 打印了 PASS ③ 输出里没有 SCRIPT ERROR。
      - name: 跑所有测试文件
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          for f in tests/*_test.gd; do
            t=$(basename "$f" .gd)
            echo "========== $t =========="
            LOG="/tmp/$t.log"
            godot --headless --path . --script "res://tests/$t.gd" 2>&1 | tee "$LOG" || FAIL=1
            if grep -q "SCRIPT ERROR" "$LOG"; then
              echo "::error file=tests/$t.gd::$t 输出里有 SCRIPT ERROR（可能假绿）"
              FAIL=1
            fi
            if ! grep -q "PASS" "$LOG"; then
              echo "::error file=tests/$t.gd::$t 没有打印 PASS"
              FAIL=1
            fi
          done
          exit $FAIL
