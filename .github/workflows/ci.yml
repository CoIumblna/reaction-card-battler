name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  battle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: 导入项目
        run: godot --headless --path . --import

      # 自动发现 tests/*_test.gd（tests/pending/ 不参与）。
      # 退出码 0 不等于全绿：脚本报错被吞时测试照样打印 PASS，
      # 所以每个文件额外要求：① 退出码 0 ② 打印了 PASS ③ 没有 SCRIPT ERROR ④ 没有 [FAIL]。
      # 另外每个文件 90 s 硬超时：死循环不会报错、只会永远不返回，
      # 没有超时的话表现是「CI 卡住 10 分钟后整个 job 超时」，看不出是哪个文件在转圈。
      - name: 跑所有测试文件
        shell: bash
        run: |
          set -uo pipefail
          FAIL=0
          for f in tests/*_test.gd; do
            t=$(basename "$f" .gd)
            echo "========== $t =========="
            LOG="/tmp/$t.log"
            timeout 90 godot --headless --path . --script "res://tests/$t.gd" > "$LOG" 2>&1
            RC=$?
            cat "$LOG"
            if [ "$RC" -eq 124 ]; then
              echo "::error file=tests/$t.gd::$t 90s 内没跑完（死循环？）"
              FAIL=1
            elif [ "$RC" -ne 0 ]; then
              FAIL=1
            fi
            if grep -q "SCRIPT ERROR" "$LOG"; then
              echo "::error file=tests/$t.gd::$t 输出里有 SCRIPT ERROR（可能假绿）"
              FAIL=1
            fi
            if grep -q "\[FAIL\]" "$LOG"; then
              echo "::error file=tests/$t.gd::$t 输出里有 [FAIL]"
              FAIL=1
            fi
            if ! grep -q "PASS" "$LOG"; then
              echo "::error file=tests/$t.gd::$t 没有打印 PASS"
              FAIL=1
            fi
          done
          exit $FAIL

      # 数据合法性（M3.5）：cards/reactions/statuses/elements 结构校验
      - name: 校验数据
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tools/validate_data.gd | tee /tmp/validate.log
          grep -q "PASS" /tmp/validate.log